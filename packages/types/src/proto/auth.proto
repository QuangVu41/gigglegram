syntax = "proto3";

package auth;

service AuthService {
  rpc Authenticate (Empty) returns (AuthenticatedSession) {}
}

message Empty {}

message AuthenticatedSession {
  Session session = 1;
  User user = 2;
}

message User {
  string id = 1;
  bool emailVerified = 2;
  string username = 3;
  string name = 4;
  optional string email = 5;
  optional string image = 6;
  string createdAt = 7;
  string updatedAt = 8;
}

message Session {
  string id = 1;
  string userId = 2;
  string expiresAt = 3;
  string token = 4;
  optional string ipAddress = 5;
  optional string userAgent = 6;
  string createdAt = 7;
  string updatedAt = 8;
}