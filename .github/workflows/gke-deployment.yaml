name: CI/CD for GKE Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GAR_IMAGE_API_REPO: 'gigglegram-api'
  GAR_IMAGE_WEB_REPO: 'gigglegram-web'
  IMAGE_API: "api"
  IMAGE_WEB: "web"

jobs:
  build-and-push:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: ${{ secrets.GCP_WI_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup GKE credentials
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_LOCATION }}

      - name: Configure Docker to use Google Cloud credentials
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_IMAGE_API_REPO }}/${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_IMAGE_WEB_REPO }}/${{ env.IMAGE_WEB }}:${{ github.sha }}

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: 'v3.18.3'

      - name: Deploy with Helm
        run: |
          helm upgrade --install gigglegram ./k8s/gigglegram \
            --namespace default \
            --set api.image.tag=${{ github.sha }} \
            --set web.image.tag=${{ github.sha }} \
            --set pg.storage.storageClassName='standard-rwo' \