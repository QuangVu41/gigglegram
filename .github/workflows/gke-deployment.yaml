name: CI/CD for GKE Deployment

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_LOCATION: ${{ secrets.GKE_LOCATION }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth
          - engagements
          - feed
          - posts
          - real-time
          - settings
          - users
          - web

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: ${{ secrets.GCP_WI_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker to use Google Cloud credentials
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push ${{ matrix.service }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile.prod
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ matrix.service }}/prod:${{ github.sha }}

  deploy:
    name: Deploy to GKE
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: ${{ secrets.GCP_WI_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup GKE credentials
        uses: "google-github-actions/get-gke-credentials@v3"
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_LOCATION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: "v3.18.3"

      - name: Deploy with Helm
        run: |
          helm upgrade --install gigglegram ./k8s/gigglegram \
            --namespace default \
            --set apps.apiGateway.image.tag=${{ github.sha }} \
            --set apps.auth.image.tag=${{ github.sha }} \
            --set apps.engagements.image.tag=${{ github.sha }} \
            --set apps.feed.image.tag=${{ github.sha }} \
            --set apps.posts.image.tag=${{ github.sha }} \
            --set apps.realTime.image.tag=${{ github.sha }} \
            --set apps.settings.image.tag=${{ github.sha }} \
            --set apps.users.image.tag=${{ github.sha }} \
            --set apps.web.image.tag=${{ github.sha }}
