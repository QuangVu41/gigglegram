    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 1
  # POSTS
  posts:
    name: posts
    replicaCount: 1
    image:
      repository: asia-southeast1-docker.pkg.dev/gigglegram-491420/posts/prod
      tag: latest
