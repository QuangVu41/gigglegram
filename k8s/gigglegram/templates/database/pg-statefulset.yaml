apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.pg.name }}
spec:
  serviceName: {{ .Values.pg.name }}
  replicas: {{ .Values.pg.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.pg.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.pg.name }}
    spec:
      containers:
        - name: {{ .Values.pg.name }}
          image: '{{ .Values.pg.image.repository }}:{{ .Values.pg.image.tag }}'
          imagePullPolicy: {{ .Values.pg.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.pg.service.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.pg.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.pg.db.name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pg.secretName }}
                  key: PG_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pg-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pg-storage
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: {{ .Values.pg.storage.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.pg.storage.size }}